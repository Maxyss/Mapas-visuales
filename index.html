<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Afiches & Mapas Visuales para Aprender Inglés | Interactive English Posters</title>
  <meta name="description" content="Aprende inglés con afiches visuales ilustrados, mapas conceptuales, vocabulario, modismos y pronunciación nativa.">
  
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body data-theme="dark">

  <!-- Navbar Header -->
  <header class="navbar">
    <div class="brand">
      <span class="brand-icon">🎨</span>
      <div class="brand-text">
        <h1>Visual English Posters</h1>
        <p>Afiches & Mapas Visuales Educativos</p>
      </div>
    </div>
    
    <div class="nav-actions">
      <button class="btn-primary" id="start-quiz-btn">
        🎯 Práctica
      </button>
      <button class="btn-secondary" id="theme-toggle-btn" title="Cambiar Tema">
        🌙 / ☀️
      </button>
    </div>
  </header>

  <!-- Controls & Category Filters -->
  <section class="controls-bar">
    <div class="category-tabs" id="category-tabs">
      <!-- Dynamic Category Tabs -->
    </div>

    <div class="search-box">
      <input type="text" id="search-input" placeholder="Buscar vocabulario o frase...">
    </div>

    <div class="view-toggle">
      <button class="toggle-btn active" data-view="poster">
        🖼️ Afiche / Poster
      </button>
      <button class="toggle-btn" data-view="mindmap">
        🕸️ Mapa Mental
      </button>
      <button class="toggle-btn" data-view="cards">
        🎴 Fichas
      </button>
    </div>
  </section>

  <!-- Main Viewport Layout Area -->
  <main class="main-container">
    
    <!-- Poster Infographic Board View (Inspired by Reference Image!) -->
    <div class="poster-view-container" id="posters-view">
      <!-- Dynamic Illustrated Poster Board injected by JS -->
    </div>

    <!-- SVG Interactive Canvas View -->
    <div class="canvas-wrapper" id="canvas-wrapper" style="display: none;">
      <div class="map-selector-bar" id="map-chips-bar"></div>
      <svg id="mindmap-svg"></svg>

      <div class="canvas-controls">
        <button class="icon-btn" id="zoom-in-btn" title="Acercar (+)">➕</button>
        <button class="icon-btn" id="zoom-out-btn" title="Alejar (-)">➖</button>
        <button class="icon-btn" id="zoom-reset-btn" title="Restablecer vista">🎯</button>
      </div>
    </div>

    <!-- Cards Grid View -->
    <div class="cards-view-container" id="cards-view" style="display: none;"></div>

    <!-- Node Inspector Bottom Sheet / Drawer -->
    <aside class="node-drawer collapsed" id="node-drawer">
      <div class="drawer-header">
        <span class="drawer-title-badge" id="drawer-type-badge">Detalle del Concepto</span>
        <button class="icon-btn" id="close-drawer-btn" title="Cerrar panel">✖</button>
      </div>
      <div class="drawer-body" id="drawer-content"></div>
    </aside>

  </main>

  <!-- Quiz Practice Modal -->
  <div class="modal-backdrop" id="quiz-modal">
    <div class="quiz-modal">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2 style="font-family: var(--font-heading); font-size: 1.2rem;">🎯 Práctica de Vocabulario</h2>
        <button class="icon-btn" id="close-quiz-btn">✖</button>
      </div>
      <div id="quiz-content"></div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
